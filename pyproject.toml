[project]
name = "moving-average"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.163.1",
    "pandas>=3.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]  # FastAPI parameter declarations

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
